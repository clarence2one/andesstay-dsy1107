spring:
  application:
    name: ms-andesstay-kafka-admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/5fb0afd3-b475-47e9-862b-1ce06143be35/v2.0}

server:
  port: ${SERVER_PORT:8087}

andesstay:
  security:
    audience: ${AZURE_API_AUDIENCE:api://e2d52786-8292-433e-a464-d575268eca38}
    roles-claim: roles
  kafka-admin:
    # Topologia de la que depende el sistema (publicada por reservations y audit): la API
    # rechaza eliminarla o modificar su configuracion con 409 para que una llamada de
    # administracion no corte los eventos. El resto de topicos se administra libremente.
    protected-topics:
      - reservations.events
      - reservations.events.DLT
      - audit.timeline
    # Timeouts del AdminClient, en milisegundos.
    request-timeout-ms: 10000
    default-api-timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.andesstay: INFO
